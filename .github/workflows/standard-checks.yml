name: standard-checks

# Deterministic checks of sk-pr-review-standard. Informational: the ruleset does
# not require this check, so it never decides a merge. See
# docs/standards/automated-checks.md.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run standard checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check-standard.py --base "origin/${BASE_REF}"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run pytest
        run: uv run --no-project --with pytest python -m pytest tests -q
